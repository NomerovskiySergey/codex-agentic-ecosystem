<!doctype html>
<title>Agentic Harness</title>
<style>body{background:#091119;color:#eaf1f7;font:16px Arial;margin:0}main{max-width:900px;margin:auto;padding:36px}.card{background:#111c26;border:1px solid #22313e;border-radius:14px;padding:20px;margin:16px 0}.tag,.pass{color:#64e3b2}.fail{color:#ff8e8e}button,input{padding:9px;border-radius:7px;border:0;margin:4px}button{background:#64e3b2;font-weight:bold}.feature{display:flex;width:100%;justify-content:space-between;text-align:left;background:#d8ffef;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.metric,pre{background:#091119;border-radius:7px;padding:10px}.metric b{display:block;font-size:20px}#events p,.verification,.git-file{border-top:1px solid #22313e;padding:10px 0;color:#b9c7d3}pre{max-height:160px;overflow:auto;white-space:pre-wrap}</style>
<main><p class="tag">AGENTIC HARNESS · LIVE DASHBOARD</p><h1 id="title">Workflow status</h1><section class="card"><input id="feature" placeholder="Feature id, e.g. FEAT-001"><button onclick="refresh()">Load feature</button><p id="status">No feature loaded.</p><div id="approvals"></div></section><section class="card"><h2>Recorded model usage</h2><div id="metrics">No usage data recorded.</div></section><section class="card"><h2>Git &amp; diff</h2><div id="git">Connecting…</div></section><section class="card"><h2>Feature history</h2><div id="history">No features recorded.</div></section><section class="card"><h2>Verification</h2><div id="verifications">No verification runs yet.</div></section><section class="card"><h2>Live activity</h2><div id="events">Connecting to runtime…</div></section></main>
<script>let feed={};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=id=>document.querySelector('#'+id);async function approve(gate,decision){const id=el('feature').value;await fetch('/api/approval',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({feature_id:id,gate,decision,rationale:'Decision recorded from dashboard.'})});refresh()}function load(id){el('feature').value=id;refresh()}function paint(){const f=feed.feature;el('title').textContent=f?f.id:'Workflow status';el('status').textContent=f?'Stage: '+f.status:'No feature loaded.';el('approvals').innerHTML=(f?.pending_approvals||[]).map(g=>`<p>${esc(g)}: <button onclick="approve('${esc(g)}','approved')">Approve</button><button onclick="approve('${esc(g)}','amended')">Request changes</button></p>`).join('');const m=feed.metrics||{},money=Number(m.cost_usd||0).toLocaleString(undefined,{style:'currency',currency:'USD'});el('metrics').innerHTML=m.recorded_runs?`<div class="grid"><div class="metric"><b>${esc(m.total_tokens)}</b>total tokens</div><div class="metric"><b>${esc(m.input_tokens)}</b>input</div><div class="metric"><b>${esc(m.output_tokens)}</b>output</div><div class="metric"><b>${esc(m.cached_tokens)}</b>cached</div><div class="metric"><b>${esc(money)}</b>${esc(m.recorded_runs)} recorded runs</div></div>`:'No usage data recorded. Values are never estimated.';const g=feed.git||{},d=g.diff||{};el('git').innerHTML=!g.available?esc(g.reason||'Git status unavailable.'):`<b>${esc(g.branch)}</b> · ${esc(g.head||'no commit')} · <span class="${g.clean?'pass':'fail'}">${g.clean?'clean':'changes pending'}</span><p>${esc(d.files_changed||0)} files · +${esc(d.insertions||0)} / -${esc(d.deletions||0)}</p>${(g.changes||[]).map(x=>`<div class="git-file">${esc(x.status)} · ${esc(x.path)}</div>`).join('')||'No working-tree changes.'}`;el('history').innerHTML=(feed.features||[]).map(x=>`<button class="feature" onclick="load('${esc(x.id)}')"><span><b>${esc(x.id)}</b> · ${esc(x.title)}</span><span>${esc(x.status)}</span></button>`).join('')||'No features recorded.';el('events').innerHTML=(feed.events||[]).map(e=>`<p><b>${esc(e.event)}</b> · ${new Date(e.at).toLocaleTimeString()}</p>`).join('')||'No events yet.';el('verifications').innerHTML=(feed.verifications||[]).map(v=>`<div class="verification"><b class="${v.ok?'pass':'fail'}">${v.ok?'PASS':'FAIL'}</b> · ${esc(v.category)} · <code>${esc((v.command||[]).join(' '))}</code><br><small>exit ${esc(v.exit_code===null?'n/a':v.exit_code)}</small>${v.output?`<pre>${esc(v.output)}</pre>`:''}</div>`).join('')||'No verification runs yet.'}async function refresh(){const id=el('feature').value,u='/api/status'+(id?'?feature_id='+encodeURIComponent(id):''),r=await fetch(u);feed=await r.json();paint()}refresh();setInterval(refresh,1000)</script>
